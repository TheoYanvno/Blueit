# Copy this file to blueit.toml and change what you like.
[blueit]
subreddits = ["nosleep", "LetsNotMeet", "Glitch_in_the_Matrix", "TrueScaryStories", "shortscarystories"]
search = ""            # optional search words, e.g. "cabin"; leave empty for top posts
time_filter = "month"  # hour, day, week, month, year or all
limit = 25             # posts to look at per subreddit
min_words = 400        # skip anything shorter
max_words = 12000      # skip anything longer (about 80 minutes of narration)
min_score = 100        # skip posts with fewer upvotes
allow_nsfw = false
output = "output"      # finished videos go here, one folder per story
images = "images"      # your pictures go here (or output/<story>/images/ for one story)
picture_seconds = 8    # about how long each picture stays on screen; it changes between sentences
shuffle_pictures = false
clip_seconds = 60      # longest length of each part
video_size = "1080x1920"  # upright for phones; "1920x1080" for widescreen
captions = true        # burn the captions into the video
library = "library.db"  # every finished story fetch finds, so nothing is made twice
voice_engine = "windows"  # windows (built-in voices), espeak (eSpeak NG) or silent (no sound, for previews)
voice = ""             # part of a voice's name, e.g. "Zira" or "David"; empty means the default voice
# voice_rate = 0       # Windows: -10 (slow) to 10 (fast); eSpeak: words per minute
