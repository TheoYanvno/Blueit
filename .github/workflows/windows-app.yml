# Builds Blueit.exe on Windows. Every push to main runs the tests and keeps the .exe as a build
# artifact; pushing a version tag (like v1.1.0) also attaches it to a GitHub Release, which is what
# the README's download link points to.
name: Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest -v
        continue-on-error: true      # some tests expect Linux tools; the build below still runs
      - name: Build Blueit.exe
        run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1
      - name: Check that it starts
        run: dist\Blueit.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: Blueit-windows
          path: |
            dist/Blueit.exe
            dist/blueit.example.toml
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Blueit.exe
            dist/blueit.example.toml
